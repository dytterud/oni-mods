name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # windows-latest deliberately: ONI is a Windows game, the dev workflow is Windows, and the
    # mod-packaging targets use backslash paths. Nothing here needs the game itself.
    runs-on: windows-latest

    # Serialised on purpose - see the -m:1 on the build step below.
    env:
      MSBUILDDISABLENODEREUSE: 1
      DOTNET_CLI_USE_MSBUILD_SERVER: false
      UseSharedCompilation: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x: the SDK. The mod is netstandard2.1 but uses LangVersion 14.0 (via PolySharp),
          #         and the solution is the .slnx format, which older SDKs can't build.
          # 8.0.x:  the runtime the test projects target.
          dotnet-version: |
            8.0.x
            10.0.x

      # No ONI install here, so OfflineBuild auto-activates and compiles against the committed
      # reference assemblies in lib/. Passed explicitly so a CI failure can never be a
      # misdetected local install. Offline also skips the assembly publicizer, so this needs no
      # `dotnet tool restore`.
      - name: Restore
        run: dotnet restore OniMods.slnx

      # -m:1 (single node, no parallel project builds) is load-bearing, not tidiness.
      # BlueprintsIncluded.Tests references the mod with different global properties
      # (DoNotBuildAsMod=true), so MSBuild treats it as a *second instance* of the same project -
      # and both instances write to the same bin/. Built in parallel they race: ILRepack rewrites
      # the assembly in place for one while the other is still copying obj -> bin, which surfaces
      # as MSB3027 "the file is locked by .NET Host". Directory.Build.targets already documents
      # the two-flavours-one-output-directory problem; this is that problem, in CI.
      #
      # The env block above stops long-lived build servers holding those outputs open between
      # steps for the same reason test/run-ingame.ps1 calls `dotnet build-server shutdown`.
      #
      # The real fix is giving the two flavours separate output directories; until then, not
      # building them at the same time is what keeps CI honest.
      - name: Build (Release, offline)
        run: dotnet build OniMods.slnx -c Release -p:OfflineBuild=true --no-restore --disable-build-servers -m:1

      # The 27 [RequiresGameInstall*] tests skip here by design - lib/ is reference-only and
      # cannot execute. Expect "14 passed, 27 skipped"; see test/README.md.
      - name: Test (offline)
        run: dotnet test OniMods.slnx -p:OfflineBuild=true --no-build -c Release --disable-build-servers

      # Offline builds write the packaged mod to Builds/, so a PR can be downloaded and tried
      # in-game without a local toolchain.
      - name: Upload packaged mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mods-${{ github.sha }}
          path: Builds/
          if-no-files-found: error
